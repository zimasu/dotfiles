# prefix — ctrl+a (easier than ctrl+b)
unbind C-b
set -g prefix C-a
bind C-a send-prefix

# terminal
set -g default-terminal "xterm-kitty"
set -ag terminal-overrides ",xterm-kitty:RGB"

# quality of life
set -g mouse on
set -g base-index 1
set -g pane-base-index 1
set -g history-limit 10000
set -sg escape-time 0
set -g focus-events on

# splits that make sense
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
unbind '"'
unbind %

# reload config
bind r source-file ~/.config/tmux/tmux.conf \; display "reloaded"

# gruvbox statusline
set -g status-style          bg='#282828',fg='#a89984'
set -g status-left           '#[bg=#d79921,fg=#282828,bold] #S #[bg=#282828,fg=#d79921] '
set -g status-right          '#[fg=#a89984] %H:%M #[bg=#504945,fg=#ebdbb2] #H '
set -g status-left-length    20
set -g window-status-current-style bg='#504945',fg='#ebdbb2'
set -g window-status-style         fg='#7c6f64'
set -g window-status-format        ' #I:#W '
set -g window-status-current-format' #I:#W '
set -g pane-border-style           fg='#3c3836'
set -g pane-active-border-style    fg='#d79921'
set -g message-style               bg='#d79921',fg='#282828'

# no plugins, no TPM
