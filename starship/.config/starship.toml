# gruvbox starship — minimal, functional
palette = "gruvbox_dark"

[palettes.gruvbox_dark]
bg0_hard = "#1d2021"
bg0      = "#282828"
bg1      = "#3c3836"
bg2      = "#504945"
fg0      = "#fbf1c7"
fg1      = "#ebdbb2"
fg4      = "#a89984"
red      = "#fb4934"
green    = "#b8bb26"
yellow   = "#fabd2f"
blue     = "#83a598"
purple   = "#d3869b"
aqua     = "#8ec07c"
orange   = "#fe8019"

format = """
$directory\
$git_branch\
$git_status\
$rust\
$c\
$cpp\
$python\
$cmd_duration\
$line_break\
$character"""

[directory]
style = "bold yellow"
truncation_length = 3
truncate_to_repo = true

[git_branch]
symbol = " "
style = "bold purple"
format = "[$symbol$branch]($style) "

[git_status]
style = "bold red"
format = "[$all_status$ahead_behind]($style) "

[rust]
symbol = " "
style = "bold orange"
format = "[$symbol$version]($style) "

[c]
symbol = " "
style = "bold blue"
format = "[$symbol$version]($style) "

[python]
symbol = " "
style = "bold green"
format = "[$symbol$version]($style) "

[cmd_duration]
min_time = 2000
style = "bold fg4"
format = "[ $duration]($style) "

[character]
success_symbol = "[❯](bold green)"
error_symbol   = "[❯](bold red)"

[line_break]
disabled = false
